<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Red Cube Gradient Surfaces -->
    <linearGradient id="swRedTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#D0101A"/>
    </linearGradient>
    <linearGradient id="swRedLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0101A"/>
      <stop offset="100%" stop-color="#8B0006"/>
    </linearGradient>
    <linearGradient id="swRedRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B20C14"/>
      <stop offset="100%" stop-color="#660004"/>
    </linearGradient>

    <!-- Wireframe Cube Fill -->
    <linearGradient id="yellowCubeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Text Bevel Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- FLOATING WIREFRAME CUBES (TRANSPARENT BACKGROUND) -->
  <!-- Bottom-Left Wireframe Cube -->
  <g stroke="#E68A00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="url(#yellowCubeFill)">
    <polygon points="40,320 130,270 220,320 130,370" />
    <polygon points="40,320 130,370 130,470 40,420" />
    <polygon points="130,370 220,320 220,420 130,470" />
  </g>

  <!-- Upper-Left Wireframe Cube -->
  <g stroke="#E68A00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="url(#yellowCubeFill)">
    <polygon points="150,110 205,80 260,110 205,140" />
    <polygon points="150,110 205,140 205,200 150,170" />
    <polygon points="205,140 260,110 260,170 205,200" />
  </g>

  <!-- Top-Center Wireframe Cube -->
  <g stroke="#E68A00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="url(#yellowCubeFill)">
    <polygon points="305,50 345,30 385,50 345,70" />
    <polygon points="305,50 345,70 345,115 305,95" />
    <polygon points="345,70 385,50 385,95 345,115" />
  </g>

  <!-- Far-Right Wireframe Cube -->
  <g stroke="#E68A00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="url(#yellowCubeFill)">
    <polygon points="425,135 455,120 485,135 455,150" />
    <polygon points="425,135 455,150 455,185 425,170" />
    <polygon points="455,150 485,135 485,170 455,185" />
  </g>

  <!-- MAIN SOLIDWORKS RED CUBE ICON -->
  <g id="SolidWorksMainCube">
    <!-- Top Face -->
    <polygon points="300,240 475,310 300,380 125,310" fill="url(#swRedTop)"/>
    <!-- Left Face -->
    <polygon points="125,310 300,380 300,490 125,420" fill="url(#swRedLeft)"/>
    <!-- Right Face -->
    <polygon points="300,380 475,310 475,420 300,490" fill="url(#swRedRight)"/>

    <!-- Subtle Edge Bevel Lines -->
    <line x1="125" y1="310" x2="300" y2="380" stroke="#FF9999" stroke-width="2" opacity="0.6"/>
    <line x1="300" y1="380" x2="475" y2="310" stroke="#FF9999" stroke-width="2" opacity="0.4"/>
    <line x1="300" y1="380" x2="300" y2="490" stroke="#FF9999" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- 3D 'S' TEXT (PERSPECTIVE TRANSFORMED) -->
  <g transform="translate(155, 335) skewY(21.8) scale(0.85, 1.15)">
    <text x="3" y="53" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" fill="#500000">S</text>
    <text x="0" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" fill="url(#textGrad)">S</text>
  </g>

  <!-- 3D 'W' TEXT (PERSPECTIVE TRANSFORMED) -->
  <g transform="translate(325, 455) skewY(-21.8) scale(0.85, 1.15)">
    <text x="3" y="3" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" fill="#380000">W</text>
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" fill="url(#textGrad)">W</text>
  </g>
</svg>
